<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 4 - Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./resources/css/style.css">
  </head>
  <body>
    <div class="row">
        <div class="col-2 eventContainer">
            <div class="modal fade" id="modal-body">
                <div class="modal-dialog">
                    <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">New Event</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="event_form" updateFlag="">
                            <label for="event_name">Event Name: </label>
                            <input 
                                id="event_name"
                                class="form-control"
                                type="text"
                                pattern="^[A-Za-z].+"
                                required
                                name="eventName"
                            >
                            
                            <label for="event_weekday">Weekday: </label>
                            <select 
                                id="event_weekday"
                                class="form-select"
                                aria-label="Default select example"
                                required
                                name="eventWeekday"
                            >
                                <option value="" disabled selected hidden>Select a Weekday</option>
                                <option value="Monday">Monday</option>
                                <option value="Tuesday">Tuesday</option>
                                <option value="Wednesday">Wednesday</option>
                                <option value="Thursday">Thursday</option>
                                <option value="Friday">Friday</option>
                                <option value="Saturday">Saturday</option>
                                <option value="Sunday">Sunday</option>
                            </select>
                            
                            <label for="event_time">Time: </label>
                            <input 
                                id="event_time"
                                class="form-control"
                                type="time"
                                required
                                name="eventTime"
                            >
                            
                            <label for="event_modality">Modality: </label>
                            <select 
                                id="event_modality"
                                class="form-select"
                                aria-label="Default select example"
                                required
                                onchange="updateModality(this.value)"
                                name="eventModality"
                            >
                                <option value="" selected disabled hidden>Select a Modality</option>
                                <option value="In-Person">In-Person</option>
                                <option value="Remote">Remote</option>
                            </select>
                            
                            <div class="hiddenField">
                                <label for="event_location">Location: </label>
                                <input
                                    id="event_location"
                                    class="form-control"
                                    type="text"
                                    pattern="^.+$"
                                    name="eventLocation"
                                >
                            </div>
                            <div class="hiddenField">
                                <label for="event_remote_url">Remote URL: </label>
                                <input
                                    id="event_remote_url"
                                    class="form-control"
                                    type="text"
                                    pattern="^(https?:\/\/)?(www\.)?[a-zA-Z][a-zA-Z0-9]*\.[a-zA-Z0-9-]+$"
                                    name="eventURL"
                                >
                            </div>

                            <label for="event_attendees">Attendees (csv): </label>
                            <input
                                id="event_attendees"
                                class="form-control"
                                type="text"
                                pattern="^[A-Za-z].+"
                                required
                                name="eventAttendees"
                            >

                            <label for="eventCategory">Event Category: </label>
                            <select 
                                id="eventCategory"
                                class="form-select"
                                aria-label="Default select example"
                                required
                                name="eventCategory"
                                onchange="loadColorFromCat(this.value)"
                            >
                                <option value="Default" selected disabled hidden>Standard</option>
                            </select>

                            <label for="eventColor">Category Color: </label>
                            <div id="eventColor" style="background-color: #0d6efd" class="form-control"></div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button id="clearForm" type="button" class="btn btn-secondary">Clear Form</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button onclick="document.getElementById('event_form').requestSubmit();" type="button" class="btn btn-primary">Create Event</button>
                    </div>
                    </div>
                </div>
            </div>
            
        </div>
        <div class="col">
            <button
                class="btn btn-primary mt-3"
                type="button"
                data-bs-toggle="modal"
                data-bs-target="#modal-body"
                onclick="loadModal();"
            >
                Create Event
            </button>
            <div class="container-md container-fluid py-4 h-100">
                <div id="calendar" class="row h-100">
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="sunday">
                        <div class="h6 text-center position-relative py-2 day">
                            Sunday
                        </div>
                        <div class="row eventsContainer">

                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="monday">
                        <div class="h6 text-center position-relative py-2 day">
                            Monday
                        </div>
                        <div class="row eventsContainer">
                            
                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="tuesday">
                        <div class="h6 text-center position-relative py-2 day">
                            Tuesday
                        </div>
                        <div class="row eventsContainer">

                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="wednesday">
                        <div class="h6 text-center position-relative py-2 day">
                            Wednesday
                        </div>
                        <div class="row eventsContainer">

                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="thursday">
                        <div class="h6 text-center position-relative py-2 day">
                            Thursday
                        </div>
                        <div class="row eventsContainer">

                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="friday">
                        <div class="h6 text-center position-relative py-2 day">
                            Friday
                        </div>
                        <div class="row eventsContainer">

                        </div>
                    </div>
                    <div class="col-sm m-1 bg-white rounded px-1 px-md-2" id="saturday">
                        <div class="h6 text-center position-relative py-2 day">
                            Saturday
                        </div>
                        <div class="row eventsContainer">

                        </div>
                    </div>
                </div>        
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./resources/js/script.js"></script>
</body>
</html>
